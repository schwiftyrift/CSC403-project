<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript Service</title>
  <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>


<header class="top-ribbon">
    <a href="/" class="ribbon-title">Transcript Service</a>

    <nav class="ribbon-nav" aria-label="Main navigation">
        <a href="/login.html" id="ribbonLogin" class="ribbon-login">
            Log In
        </a>

        <span
            id="ribbonProfile"
            class="ribbon-profile"
            aria-label="Signed in"
            title="Signed in"
            hidden
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M5.5 19a7 7 0 0 1 13 0"/>
            </svg>
        </span>
    </nav>
</header>


<button
  type="button"
  id="menuButton"
  class="menu-button"
  aria-label="Open navigation menu"
  aria-expanded="false"
>
  ☰
</button>

<nav id="sidebar" class="sidebar">
  <div class="sidebar-top">
    <h2>Transcript Service</h2>
    <a href="/">Home</a>
    <a href="/upload.html">Upload</a>
    <a href="/history.html">Your uploads</a>
    <div class="settings-dropdown">
      <button type="button" id="settingsToggle" aria-expanded="false" aria-controls="settingsOptions">
        Settings
        <span class="dropdown-arrow">▸</span>
      </button>

      <div id="settingsOptions" class="settings-options" hidden>
        <a href="/settings.html#accountSettings">Account Settings</a>
        <a href="/settings.html#siteSettings">Site/Theme Settings</a>
      </div>
    </div>
  </div>

  <button type="button" id="logout" class="logout">Log Out</button>
</nav>
<div class="page-with-ads">
    <aside class="side-ad" aria-label="Advertisement">
        <span class="ad-label">Advertisement</span>
        <img
            src="/images/ad-left.png"
            alt="Advertisement"
            loading="lazy"
        >
    </aside>
    <main>
    <h1>Transcript Service</h1>
    <p class="sub">Upload an audio or video file and it will be transcribed automatically.</p>


    <div class="card" id="upload">
        <label id="drop" for="file">
        <strong>Drag a file here</strong>
        <span id="dropHint">or click to choose one</span>
        </label>
        <input type="file" id="file">

        <div id="chosen">
        <div><div id="name"></div><div id="size"></div></div>
        <button type="button" class="secondary" id="clear">Remove</button>
        </div>

        <progress id="bar" max="100" value="0"></progress>
        <div id="uploadProgressText"></div>

        <div class="row">
        <button type="button" id="go" disabled>Upload</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        <pre id="result"></pre>
    </div>
    </main>

    <aside class="side-ad" aria-label="Advertisement">
        <span class="ad-label">Advertisement</span>
        <img
            src="/images/ad-right.png"
            alt="Advertisement"
            loading="lazy"
        >
    </aside>
</div>

<script type="module" src="/upload.js"></script>
<script src="/verify-banner.js"></script>
<script src="/job-progress.js"></script>
</body>
</html>
