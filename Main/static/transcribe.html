<!DOCTYPE html>
<html lang="en">
    <head>
         <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Transcript Service</title>
        <link rel="stylesheet" href="/style.css">
    </head>

<body class="transcribePage">
<header class="top-ribbon">
    <a href="/" class="ribbon-title">Transcript Service</a>

    <nav class="ribbon-nav" aria-label="Main navigation">
        <a href="/login.html" id="ribbonLogin" class="ribbon-login">
            Log In
        </a>

        <span
            id="ribbonProfile"
            class="ribbon-profile"
            aria-label="Signed in"
            title="Signed in"
            hidden
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M5.5 19a7 7 0 0 1 13 0"/>
            </svg>
        </span>
    </nav>
</header>


        <button
        type="button"
        id="menuButton"
        class="menu-button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        >
        ☰
        </button>

    <nav id="sidebar" class="sidebar">
    <div class="sidebar-top">
        <h2>Transcript Service</h2>
        <a href="/">Home</a>
        <a href="/upload.html">Upload</a>
        <a href="/history.html">Your uploads</a>
        <div class="settings-dropdown">
        <button type="button" id="settingsToggle" aria-expanded="false" aria-controls="settingsOptions">
            Settings
            <span class="dropdown-arrow">▸</span>
        </button>

        <div id="settingsOptions" class="settings-options" hidden>
            <a href="/settings.html#accountSettings">Account Settings</a>
            <a href="/settings.html#siteSettings">Site/Theme Settings</a>
        </div>
        </div>
    </div>

  <button type="button" id="logout" class="logout">Log Out</button>
</nav>

<div class="page-with-ads">
    <aside class="side-ad" aria-label="Advertisement">
        <span class="ad-label">Advertisement</span>
        <img
            src="/images/ad-left.png"
            alt="Advertisement"
            loading="lazy"
        >
    </aside>     
    <main>
        <h1>Transcript Service</h1>
        
        <div id="transcribeContainer" class="transcribeContainer">
            <section class="card">
                <h2 id="transcriptFilename">Transcript</h2>
                <p id="transcriptStatus" role="status" aria-live="polite"></p>
                <div id="transcriptText"></div>
                <section id="styledOutputs" aria-label="Study outputs" hidden>
                    <h3>Study outputs</h3>
                    <div id="outputSelections"></div>
                    <button id="generateOutputs" type="button">Generate selected outputs</button>
                    <p id="outputStatus" role="status" aria-live="polite"></p>
                    <div id="outputTabs" role="tablist" aria-label="Output format"></div>
                    <div id="outputPanel" role="tabpanel" tabindex="0"></div>
                    <div id="outputActions" class="actions"></div>
                </section>
            </section>
        </div>
    </main>

    <aside class="side-ad" aria-label="Advertisement">
            <span class="ad-label">Advertisement</span>
            <img
                src="/images/ad-right.png"
                alt="Advertisement"
                loading="lazy"
            >
        </aside>
</div>

    <script type="module" src="/transcribe.js"></script>
    <script src="/job-progress.js"></script>
    </body>
</html>
