<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your uploads - Transcript Service</title>
  <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>

<button
  type="button"
  id="menuButton"
  class="menu-button"
  aria-label="Open navigation menu"
  aria-expanded="false"
>
  ☰
</button>

<nav id="sidebar" class="sidebar">
  <div class="sidebar-top">
    <h2>Transcript Service</h2>
    <a href="/">Home</a>
    <a href="/#upload">Upload</a>
    <a href="/history.html" aria-current="page">Your uploads</a>
    <a href="/#account">Account</a>
    <a href="/settings.html">Settings</a>
  </div>

  <button type="button" id="logout" class="logout">Log Out</button>
</nav>

<main>
  <h1>Your uploads</h1>
  <p class="sub">Download or permanently delete the files you uploaded. Deleting a file also deletes its transcript.</p>
  <div id="status" role="status" aria-live="polite"></div>

  <section class="card" id="history" hidden>
    <div class="history-toolbar">
      <div class="view-toggle" role="group" aria-label="Layout">
        <button type="button" class="secondary" id="listView" aria-pressed="true">List</button>
        <button type="button" class="secondary" id="gridView" aria-pressed="false">Grid</button>
        <button type="button" class="secondary" id="alphaSort" aria-pressed="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            id="alphaSortDesc"
            aria-hidden="true"
          >
            <path d="m13 16 4 4 4-4"></path>
            <path d="M17 20V4"></path>
            <path d="M8 8H3"></path>
            <path d="M3 10V6.5a2.5 2.5 0 0 1 5 0V10"></path>
            <path d="M3 14h5l-5 6h5"></path>
          </svg>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            id="alphaSortAsc"
            aria-hidden="true"
            style="display: none;"
          >
            <path d="m13 8 4-4 4 4"></path>
            <path d="M17 4v16"></path>
            <path d="M8 8H3"></path>
            <path d="M3 10V6.5a2.5 2.5 0 0 1 5 0V10"></path>
            <path d="M3 14h5l-5 6h5"></path>
          </svg>
        </button>
        <button type="button" class="secondary" id="dateSort" aria-pressed="false">
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" 
            height="24" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            id="dateSortDesc"
            aria-hidden="true"
            >
            <path d="M12 6v6l2 1"/>
            <path d="M12.337 21.994a10 10 0 1 1 9.588-8.767"/>
            <path d="m14 18 4 4 4-4"/>
            <path d="M18 14v8"/>
          </svg>

          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" 
            height="24" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            id="dateSortAsc"
            aria-hidden="true"
            style="display: none;"
            >
            <path d="M12 6v6l1.56.78"/>
            <path d="M13.227 21.925a10 10 0 1 1 8.767-9.588"/>
            <path d="m14 18 4-4 4 4"/>
            <path d="M18 22v-8"/>
          </svg>
        </button>
        <button type="button" class="secondary" id="sizeSort" aria-pressed="false">
          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" 
            height="24" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            id="sizeSortDesc"
            aria-hidden="true"
            style="display: none;"
          >
            <path d="m16 19 3 3 3-3"/>
            <path d="M19 16v6"/>
            <path d="M21 12.536V5"/>
            <path d="M3 12A9 3 0 0 0 15.182 14.806"/>
            <path d="M3 5V19A9 3 0 0 0 13.318 21.968"/>
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
          </svg>

          <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" 
            height="24"
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            id="sizeSortAsc"
            aria-hidden="true"

          >
            <path d="M19 22v-6"/>
            <path d="M21 12.536V5"/>
            <path d="m22 19-3-3-3 3"/>
            <path d="M3 12A9 3 0 0 0 14.457 14.886"/>
            <path d="M3 5V19A9 3 0 0 0 13.318 21.968"/>
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
          </svg>
        </button>

      </div>
      <button type="button" class="secondary" id="refreshHistory">Refresh</button>
      <button type="button" class="danger" id="deleteAll" disabled>Delete all</button>
    </div>
    <p id="emptyHistory" hidden>No uploads yet.</p>
    <div id="historyList" class="list-view"></div>
    <button type="button" id="moreHistory" hidden>Load more</button>
  </section>
</main>
<script src="/history.js"></script>
<script src="/verify-banner.js"></script>
<script src="/job-progress.js"></script>
</body>
</html>
