<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Transcript Service</title>
    <link rel="stylesheet" href="/style.css?v=2">
</head>


<header class="top-ribbon">
    <a href="/" class="ribbon-title">Transcript Service</a>

    <nav class="ribbon-nav" aria-label="Main navigation">
        <a href="/login.html" id="ribbonLogin" class="ribbon-login">
            Log In
        </a>

        <span
            id="ribbonProfile"
            class="ribbon-profile"
            aria-label="Signed in"
            title="Signed in"
            hidden
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M5.5 19a7 7 0 0 1 13 0"/>
            </svg>
        </span>
    </nav>
</header>


<body>

<button
    type="button"
    id="menuButton"
    class="menu-button"
    aria-label="Open navigation menu"
    aria-expanded="false"
    disabled
>
    ☰
</button>

    <nav id="sidebar" class="sidebar">
        <div class="sidebar-top">
            <h2>Transcript Service</h2>

            <a href="/">Home</a>
            <a href="/upload.html">Upload</a>
            <a href="/history.html">Your uploads</a>

            <div class="settings-dropdown">
                <button
                    type="button"
                    id="settingsToggle"
                    aria-expanded="false"
                    aria-controls="settingsOptions"
                >
                    Settings
                    <span class="dropdown-arrow">▸</span>
                </button>

                <div id="settingsOptions" class="settings-options" hidden>
                    <a href="/settings.html#accountSettings">Account Settings</a>
                    <a href="/settings.html#siteSettings">Site/Theme Settings</a>
                </div>
            </div>
        </div>

        <button type="button" id="logout" class="logout" hidden>
            Log Out
        </button>
    </nav>

    <main>
        <h1>Transcript Service</h1>

        <section class="card">
            <h2>Welcome</h2>
            <p>
                Upload audio and video recordings, generate transcripts,
                and manage your files from one place.
            </p>

            <a href="/upload.html">Go to Uploads</a>
        </section>
    </main>

    <script type="module" src="/index.js"></script>
</body>
</html>
