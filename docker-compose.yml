name: 403-webserver

services:
  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    volumes:
      - output_models:/root/.ollama

  output-worker:
    build:
      context: .
      dockerfile: Main/Dockerfile
    command: ["python", "-m", "service.output_worker"]
    restart: unless-stopped
    volumes:
      - uploads:/data
    environment:
      OLLAMA_URL: http://ollama:11434
      OUTPUT_MODEL: ${OUTPUT_MODEL:-qwen3:1.7b}
    depends_on:
      - ollama
  api:
    build:
      context: .
      dockerfile: Main/Dockerfile
    restart: unless-stopped
    ports:
      - "8087:8000"      # left side: the port NPM forwards to
    volumes:
      - uploads:/data    # uploads + app.db survive restarts and rebuilds
    environment:
      MAX_UPLOAD_MB: "500"
      # Email and public address come from a .env file next to this one (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}

  worker:
    build:
      context: .
      dockerfile: Transcribe/Dockerfile
    restart: unless-stopped
    volumes:
      - uploads:/data            # same volume, same path as the api
      - whisper_models:/models   # model cache so rebuilds don't re-download
    environment:
      WHISPER_MODEL: medium
      WHISPER_THREADS: "4"
    deploy:
      replicas: 3

volumes:
  output_models:
  uploads:          # keep this name: renaming it creates a new, empty volume
  whisper_models:
