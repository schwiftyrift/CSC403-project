<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript Service</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<button
  type="button"
  id="menuButton"
  class="menu-button"
  aria-label="Open navigation menu"
  aria-expanded="false"
>
  ☰
</button>

<nav id="sidebar" class="sidebar">
  <div class="sidebar-top">
    <h2>Transcript Service</h2>
    <a href="/">Home</a>
    <a href="/transcribe">Transcribe</a>
    <a href="/archive">Archive</a>
    <a href="/settings">User Settings</a>
  </div>

    <a href="/login.html" class="logout">Log Out</a>
</nav>

<main>
  <h1>Transcript Service</h1>
  <p class="sub">Upload an audio or video file to turn it into text.</p>

  <div class="card">
    <label id="drop" for="file">
      <strong>Drag a file here</strong>
      <span>or click to choose one &middot; mp3, wav, m4a, mp4, mov</span>
    </label>
    <input type="file" id="file" accept=".mp3,.wav,.m4a,.mp4,.mov,audio/*,video/*">

    <div id="chosen">
      <div><div id="name"></div><div id="size"></div></div>
      <button type="button" class="secondary" id="clear">Remove</button>
    </div>

    <progress id="bar" max="100" value="0"></progress>

    <div class="row">
      <button type="button" id="go" disabled>Upload</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <pre id="result"></pre>
  </div>
</main>
<script src="/script.js"></script>
</body>
</html>
