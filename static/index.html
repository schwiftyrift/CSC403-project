<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript Service</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<button
  type="button"
  id="menuButton"
  class="menu-button"
  aria-label="Open navigation menu"
  aria-expanded="false"
>
  ☰
</button>

<nav id="sidebar" class="sidebar">
  <div class="sidebar-top">
    <h2>Transcript Service</h2>
    <a href="/">Home</a>
    <a href="#upload">Upload</a>
    <a href="#history">Your uploads</a>
    <a href="#account">Account</a>
  </div>

  <button type="button" id="logout" class="logout" hidden>Log Out</button>
</nav>

<main>
  <h1>Transcript Service</h1>
  <p class="sub">Upload and store audio or video files in your account. Automatic transcription is not available yet.</p>

  <section class="card" id="account">
    <h2>Account</h2>
    <p id="accountStatus" role="status">Sign in to upload files and view your history.</p>
    <form id="authForm">
      <label>Email <input id="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label>Password (12-128 characters) <input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label>
      <div class="row"><button type="submit">Log in</button><button type="submit" id="register" class="secondary">Create account</button></div>
    </form>
  </section>
  <section class="card" id="history" hidden>
    <h2>Your uploads</h2>
    <button type="button" id="refreshHistory" class="secondary">Refresh history</button>
    <div id="historyList"></div>
    <button type="button" id="moreHistory" hidden>Load more</button>
  </section>
  <div class="card" id="upload">
    <label id="drop" for="file">
      <strong>Drag a file here</strong>
      <span>or click to choose one &middot; mp3, wav, m4a, mp4, mov</span>
    </label>
    <input type="file" id="file" accept=".mp3,.wav,.m4a,.mp4,.mov,audio/*,video/*">

    <div id="chosen">
      <div><div id="name"></div><div id="size"></div></div>
      <button type="button" class="secondary" id="clear">Remove</button>
    </div>

    <progress id="bar" max="100" value="0"></progress>

    <div class="row"><button type="button" id="go" disabled>Upload</button></div>
    <div id="status" role="status" aria-live="polite"></div>
    <pre id="result"></pre>
  </div>
</main>
<script src="/script.js"></script>
</body>
</html>
